name: 新闻数据更新后自动部署

on:
  workflow_run:
    workflows: ["获取AI新闻并更新", "Auto Blog Generation"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm install

      - name: 构建项目
        run: npm run build

      - name: 设置Pages
        uses: actions/configure-pages@v4

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # CF Pages 是主站(news.aipush.fun)，优先部署；其 Git 集成不响应 GITHUB_TOKEN 的推送，必须在此显式部署
      - name: 部署到Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4c1d8aa164a8e9f8a174a9e89fd3bffe
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "⚠️ 未配置 CLOUDFLARE_API_TOKEN secret，跳过 Cloudflare Pages 部署"
            exit 0
          fi
          npx wrangler@4 pages deploy ./dist --project-name=ai-news --branch=main

      # GH Pages 仅作备份站，偶发 "Deployment failed, try again later" 不应让整个工作流告警
      - name: 部署到GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
