name: 获取AI新闻 (Grok)

on:
  schedule:
    # 每天运行两次（UTC 0点和12点 = 北京时间8点和20点）
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fetch-news
  cancel-in-progress: true

jobs:
  fetch-and-update-news:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: Grok AI 新闻抓取
        env:
          GROK_API_BASE: ${{ secrets.GROK_API_BASE }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GROK_MODEL: ${{ secrets.GROK_MODEL }}
        run: node scripts/fetch-news-grok.js

      - name: 生成RSS feed
        run: node scripts/generate-feed.js

      - name: 配置Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: 提交更新的新闻数据
        run: |
          git fetch origin main
          git checkout main
          git pull origin main

          if git diff --quiet public/news-data.json; then
            echo "新闻数据没有变化，跳过提交"
          else
            echo "检测到新闻数据更新，准备提交"
            git add public/news-data.json public/version.json
            git commit -m "🤖 Grok AI 自动更新新闻 - $(date +'%Y-%m-%d %H:%M:%S UTC')"
            git push origin main
          fi